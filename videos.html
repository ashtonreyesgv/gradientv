<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videos - GradientV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/icons/logo_light.ico">
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .video-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .video-player {
      width: 100%;
      max-width: 900px;
      margin: 2rem auto;
      background: #f5f5f5;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-player video {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-info {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    .video-title {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .video-description {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #333;
      margin-bottom: 2rem;
    }

    .founding-members {
      margin-bottom: 2rem;
    }

    .founding-members h3 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }

    .founding-members p {
      color: #666;
      margin-bottom: 0.5rem;
    }

    .contact-info {
      background: #f9f9f9;
      padding: 1.5rem;
      border-radius: 8px;
      margin-top: 2rem;
    }

    .contact-info h3 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
    }

    .contact-info p {
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .contact-info a {
      color: #0066cc;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <nav class="nav">
        <a href="index.html#about">About</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#supported">Partnerships</a>
        <a href="index.html#team">Team</a>
        <a href="index.html#contact">Contact</a>
        <a href="videos.html">Videos</a>
      </nav>

      <a href="index.html" class="gv-brand-lockup" aria-label="GradientV">
        <img src="./images/brand/stacked_black_t.png" alt="GradientV" class="gv-brand-stacked" />
      </a>
    </div>
  </header>

  <main>
    <section class="brand-banner" aria-label="GradientV Videos">
      <div class="container">
        <h1 style="text-align: center; font-size: 2.5rem; margin: 2rem 0;">Videos</h1>
      </div>
    </section>

    <section class="video-container">
      <div class="video-player">
        <video controls>
          <source src="./videos/introduction.mp4" type="video/mp4">
          Your browser doesn't support HTML5 video. Please update your browser.
        </video>
      </div>

      <div class="video-info">
        <h2 class="video-title">GradientV Introduction</h2>
        <p class="video-description">
          Meet the team behind GradientV and learn about our mission to help businesses adopt AI in practical, measurable ways.
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="index.html" class="footer-brand" aria-label="GradientV">
        <img src="./images/brand/stacked_white_t.png" alt="GradientV" />
      </a>
      <p class="footer-copy">&copy; 2026 GradientV. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
